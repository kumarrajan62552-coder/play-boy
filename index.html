    <!-- Interactive Script Logic -->
    <script>
        // Target Link & Options
        const TELEGRAM_URL = "https://t.me/+uECO1q_eLqJiMmRl";
        const TOTAL_SECONDS = 60;
        let countdownSeconds = TOTAL_SECONDS;

        const countdownDisplay = document.getElementById('countdownDisplay');
        const secondsText = document.getElementById('secondsText');
        const progressRing = document.getElementById('progressRing');
        const telegramBtn = document.getElementById('telegramLink');

        // Circle circumference for SVG ring calculation (2 * PI * r) where r = 45 -> ~282.74
        const CIRCUMFERENCE = 2 * Math.PI * 45;

        function setProgress(percent) {
            const offset = CIRCUMFERENCE - (percent / 100 * CIRCUMFERENCE);
            progressRing.style.strokeDashoffset = offset;
        }

        // Initialize ring stroke state
        setProgress(100);

        // Countdown Timer Logic
        const timerInterval = setInterval(() => {
            countdownSeconds--;

            if (countdownSeconds >= 0) {
                // Update display (.60, .59, .58...)
                const formattedNum = countdownSeconds < 10 ? `0${countdownSeconds}` : countdownSeconds;
                countdownDisplay.textContent = `.${formattedNum}`;
                secondsText.textContent = countdownSeconds;

                // Update ring progress percentage
                const progressPercent = (countdownSeconds / TOTAL_SECONDS) * 100;
                setProgress(progressPercent);
            }

            if (countdownSeconds <= 0) {
                clearInterval(timerInterval);
                countdownDisplay.textContent = ".00";
                secondsText.textContent = "0";
                setProgress(0);

                // Automatic redirect after countdown reaches zero
                setTimeout(() => {
                    window.location.href = TELEGRAM_URL;
                }, 400);
            }
        }, 1000);

        // Ripple Effect on Button Click
        telegramBtn.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.style.width = ripple.style.height = `${Math.max(rect.width, rect.height)}px`;

            this.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 600);
        });

        // Interactive Deep Space Starfield Canvas Particle System
        const canvas = document.getElementById('starfieldCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        let stars = [];
        const STAR_COUNT = Math.min(Math.floor(window.innerWidth * 0.15), 120);

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.color = Math.random() > 0.45 ? '#00f2fe' : (Math.random() > 0.5 ? '#ff0844' : '#a855f7');
                this.alpha = Math.random();
                this.alphaSpeed = (Math.random() * 0.02 + 0.005) * (Math.random() > 0.5 ? 1 : -1);
                this.velocityY = -(Math.random() * 0.2 + 0.05);
            }

            update() {
                this.y += this.velocityY;
                if (this.y < 0) this.y = height;

                this.alpha += this.alphaSpeed;
                if (this.alpha >= 1 || this.alpha <= 0.1) {
                    this.alphaSpeed = -this.alphaSpeed;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha));
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.size * 4;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function render() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(render);
        }

        initStars();
        render();
    </script>
